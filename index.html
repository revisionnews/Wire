<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="theme-color" content="#D4D4D4"><link rel="icon" href="/favicon.ico?v=2" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png?v=2"><link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png?v=2"><link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Wire">
<title>Revision Wire</title>
<style>
/*FONTS*/
</style>
<style>
/* Map variables, copied from the live Revision org map. #dark switches the theme like the bulb. */
:root{
  --paper:#D4D4D4;--thin:#0D0F12;--thick:#0D0F12;--mast:#B3B3B3;--mast-text:#0D0F12;--fig:#B3B3B3;--blk:#2B2B2B;--blkt:#D9D9D9;--onblk:#F3F4F5;
  --ink:var(--thick);--muted:var(--thin);--hair:color-mix(in srgb,var(--thin) 40%,var(--paper));--dim:color-mix(in srgb,var(--thin) 72%,var(--paper));
  --red:#D94032;--orange:#A8581A;--green:#397D46;--teal:#248087;--grey:#8F8F8F;
  --u:10px; --b:2px;
  --grain-data:/*GRAIN*/;
  --logo:url(/*LOGO*/);
  color-scheme:light;
}
html.dark{--paper:#0D0F12;--thin:#D4D4D4;--thick:#D4D4D4;--mast:#2B2B2B;--mast-text:#D4D4D4;--fig:#262A2F;--blk:#D4D4D4;--blkt:#2B2B2B;--onblk:#0D0F12;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;overflow:hidden}
body{font:400 16px/1.5 'Hando','Helvetica Neue',Arial,sans-serif;color:var(--ink)}

.stage{position:fixed;background:var(--paper);color:var(--ink);overflow:hidden;font-family:'Hando','Helvetica Neue',Arial,sans-serif}
.grain{position:absolute;inset:0;pointer-events:none;z-index:60;opacity:.33;background-image:var(--grain-data);background-size:192px 192px,240px 240px}
html.dark .grain{opacity:.16;mix-blend-mode:screen}.grain2{display:none}html.dark .grain2{display:block;position:absolute;inset:0;pointer-events:none;z-index:60;opacity:.25;mix-blend-mode:multiply;background-image:var(--grain-data);background-size:192px 192px,240px 240px}html.tvm .grain2{will-change:transform;transform:translateZ(0)}html.dark .wkey .ks::before{content:'';position:absolute;inset:0;pointer-events:none;z-index:1;background-image:var(--grain-data);background-size:192px 192px,240px 240px;opacity:.3;mix-blend-mode:multiply}

/* Masthead: the Office header pattern */
.mast{position:absolute;left:0;right:0;top:0;z-index:20;height:calc(var(--u)*10);display:flex;align-items:center;gap:calc(var(--u)*2);
  background:var(--mast);color:var(--mast-text);border:var(--b) solid var(--ink);padding:0 0 0 calc(var(--u)*2.2)}
.brand{display:flex;align-items:center;gap:calc(var(--u)*2.2);min-width:0}
.brand .ws{font:900 calc(var(--u)*5)/1 'Hando',sans-serif;letter-spacing:.03em;text-transform:uppercase}
.brand .dv{flex:none;width:var(--b);height:calc(var(--u)*5.6);background:var(--ink)}
.logo{display:block;width:calc(var(--u)*21);height:calc(var(--u)*2.94);background:currentColor;-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat}
.who{margin-left:auto;text-align:right;display:flex;flex-direction:row;align-items:center;gap:calc(var(--u)*2);padding-right:calc(var(--u)*2.2);white-space:nowrap}
.who b{font:900 calc(var(--u)*6)/1 'Hando',sans-serif}
.who span{display:flex;flex-direction:column;gap:calc(var(--u)*.5);font:700 calc(var(--u)*1.7)/1.1 'Hando',sans-serif;letter-spacing:.12em;text-transform:uppercase;text-align:right}
.who span i{font-style:normal}
.who span i:first-child{font-weight:900}

.alert{position:absolute;left:0;right:0;top:calc(var(--u)*10);z-index:18;display:none;background:var(--red);color:#fff;padding:calc(var(--u)*1) calc(var(--u)*2.2);
  font:900 calc(var(--u)*2.6)/1.1 'Hando',sans-serif;letter-spacing:.06em;text-transform:uppercase;border:var(--b) solid var(--ink)}
.alert.on{display:block}

.view{position:absolute;left:0;right:0;top:calc(var(--u)*10);bottom:0;overflow:hidden}
.track{will-change:transform;padding:0 calc(var(--u)*2.2)}
.copy{padding-top:calc(var(--u)*3)}

/* Sections: a dark band with a heading, then a framed panel */
.sec{margin-bottom:calc(var(--u)*3.4)}
.band{display:flex;align-items:center;gap:calc(var(--u)*1.2);background:var(--blk);color:var(--onblk);border:var(--b) solid var(--blk);padding:calc(var(--u)*1.1) calc(var(--u)*1.8)}
.band h2{font:900 calc(var(--u)*2.7)/1.1 'Hando',sans-serif;letter-spacing:-.01em}
.band small{margin-left:auto;font:700 calc(var(--u)*1.25)/1.3 'Hando',sans-serif;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.panel{border:var(--b) solid var(--ink);border-top:0;padding:calc(var(--u)*1.8);background:var(--paper)}

.k{font:700 calc(var(--u)*1.25)/1.3 'Hando',sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.pill{display:inline-block;white-space:nowrap;border:var(--b) solid var(--c,var(--ink));color:var(--c,var(--ink));font:700 calc(var(--u)*1.25)/1 'Hando',sans-serif;letter-spacing:.12em;text-transform:uppercase;padding:calc(var(--u)*.55) calc(var(--u)*.9)}
.pill.fill{background:var(--c,var(--ink));color:#fff}
.s-Confirmed,.s-Used{--c:var(--green)}
.s-Expected{--c:var(--orange)}
.s-Reported,.s-Watching,.s-Open,.s-Checked{--c:var(--teal)}
.s-Background,.s-NotConnected,.s-Notchecked{--c:var(--grey)}
.s-Official{--c:var(--blk)}
.s-News{--c:var(--ink)}
html.dark .s-Official{--c:var(--ink)}

/* Overview */
.ov{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(0,1fr);gap:calc(var(--u)*1.8)}
.big{font:900 calc(var(--u)*10)/1 'Hando',sans-serif;margin-top:calc(var(--u)*.8)}
.big small{font:700 calc(var(--u)*2.6) 'Hando',sans-serif;letter-spacing:.06em;margin-left:calc(var(--u)*.8)}
.stat{font:400 calc(var(--u)*2.1)/1.35 'Hando',sans-serif;margin:calc(var(--u)*.6) 0 calc(var(--u)*1.8)}
.cats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:calc(var(--u)*.8);margin-top:calc(var(--u)*.8)}
.cat{border:var(--b) solid var(--ink);border-top:calc(var(--u)*.8) solid var(--c,var(--ink));padding:calc(var(--u)*.8) calc(var(--u)*.9) calc(var(--u)*.9)}
.cat.zero{opacity:.45}
.cat b{display:block;font:900 calc(var(--u)*4.4)/1 'Hando',sans-serif}
.cat span{display:block;font:700 calc(var(--u)*1.05)/1.2 'Hando',sans-serif;letter-spacing:.1em;text-transform:uppercase;margin-top:calc(var(--u)*.5)}
.legend{display:flex;flex-wrap:wrap;gap:calc(var(--u)*.7);margin-top:calc(var(--u)*1.2)}
.act{background:var(--blk);color:var(--onblk);padding:calc(var(--u)*1.8);display:flex;flex-direction:column;gap:calc(var(--u)*1)}
.act .plus{font:300 calc(var(--u)*9)/.8 'Hando',sans-serif}
.act b{font:900 calc(var(--u)*2.8)/1.1 'Hando',sans-serif}
.act p{font-size:calc(var(--u)*1.7);line-height:1.4;opacity:.92}

/* Stories */
.story{--c:var(--ink);border:var(--b) solid var(--ink);margin-bottom:calc(var(--u)*1.6);background:var(--paper)}
.story:last-child{margin-bottom:0}
.sh{display:flex;justify-content:space-between;align-items:center;gap:calc(var(--u)*1.4);padding:calc(var(--u)*1.1) calc(var(--u)*1.6);border-bottom:1px solid var(--hair)}
.meta{font:700 calc(var(--u)*1.25)/1.35 'Hando',sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.story h3{font:900 calc(var(--u)*3.7)/1.1 'Hando',sans-serif;padding:calc(var(--u)*1.4) calc(var(--u)*1.6) calc(var(--u)*.8)}
.story p.sum{font:400 calc(var(--u)*2.15)/1.42 'Hando',sans-serif;padding:0 calc(var(--u)*1.6) calc(var(--u)*1.6)}

/* Breaking: solid fill block inside the column grid */
.story.brk{background:var(--red);color:#fff;border-color:var(--ink)}
.story.brk>:not(.refs){box-shadow:none;padding-left:calc(var(--u)*1.6) !important;color:#fff}
.story.brk .sh{border-bottom:var(--b) solid rgba(255,255,255,.55)}
.story.brk .meta{color:#fff}
.story.brk h3{font-size:calc(var(--u)*4.4)}
.story.brk p.sum{font-size:calc(var(--u)*2.3)}
.story.brk .pill.fill{background:#fff;color:var(--red);border-color:#fff}
.story.brk .new{background:#fff;color:var(--red)}
.story.brk .refs{color:var(--ink)}
/* Sources: a ledger of citations, not blocks */
.refs{border-top:var(--b) solid var(--ink);background:var(--fig);padding:calc(var(--u)*.7) calc(var(--u)*1.2);display:flex;align-items:center;gap:calc(var(--u)*1.2)}
.refs .k{display:none}
.rw{flex:1;min-width:0}
.rl{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:calc(var(--u)*.35) calc(var(--u)*1.3)}
.rl li{display:inline-flex;align-items:baseline;gap:calc(var(--u)*.45);white-space:nowrap}
.rl .n{font:900 calc(var(--u)*1.2)/1.2 'Hando',sans-serif;color:var(--dim)}
.rl .o{font:900 calc(var(--u)*1.4)/1.2 'Hando',sans-serif;letter-spacing:.05em;text-transform:uppercase}
.rl .m{font:700 calc(var(--u)*1)/1.2 'Hando',sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.rl .m b{font-weight:900;color:var(--ink);margin-left:calc(var(--u)*.4)}
.qr{flex:none;display:flex;align-self:stretch}
.refs{height:calc(var(--u)*7.2);box-sizing:border-box;overflow:hidden}
.qb{box-sizing:border-box;width:calc(var(--u)*7.2);height:100%;background:#fff;color:#000;border-left:var(--b) solid var(--ink)}
.qb{position:relative}.qb svg{position:absolute;left:calc(var(--u)*.12);top:calc(var(--u)*.12);width:calc(100% - var(--u)*.24);height:calc(100% - var(--u)*.24);display:block}
.qr span{display:none}
.refs.top{border-top:0;border-bottom:var(--b) solid var(--ink)}
.xt{display:flex;align-items:center;gap:calc(var(--u)*.8);margin-bottom:calc(var(--u)*.35)}
.xt .pill{font-size:calc(var(--u)*1.1)}
.story.brk .refs.top{background:var(--fig)}
.refs.top{height:calc(var(--u)*8.4);padding:0 0 0 calc(var(--u)*1.6);gap:calc(var(--u)*1.4)}
.refs.top .rw{align-self:center;display:flex;flex-direction:column;gap:calc(var(--u)*.5);padding:0}
.refs.top .xt{margin:0;gap:calc(var(--u)*.9);flex-wrap:nowrap;white-space:nowrap}
.refs.top .rl{flex-direction:column;flex-wrap:nowrap;gap:calc(var(--u)*.3)}
.refs.top .rl li{min-width:0}
.refs.top .rl .o{font-size:calc(var(--u)*1.35);overflow:hidden;text-overflow:ellipsis}
.tg{flex:none;align-self:center}
.tg .pill{display:inline-block;margin:0;font-size:calc(var(--u)*1.2);padding:calc(var(--u)*.45) calc(var(--u)*.9)}
.refs.top .qb{width:calc(var(--u)*8.4)}
.refs.top .rw .meta{margin:0;font-size:calc(var(--u)*1.25)}
.refs.top .rw{gap:calc(var(--u)*1)}
.refs.top .rl .o{font-size:calc(var(--u)*1.55)}
.refs.top .rl .n{font-size:calc(var(--u)*1.3)}
/* v4: strip at the bottom */
.refs.top{border-top:0;border-bottom:0}
.refs.top::after{display:none}
.refs.top::before{content:'';position:absolute;left:calc(var(--u)*.85);right:0;top:0;border-top:var(--b) solid var(--ink)}
.story .refs.top .tg{margin-left:0}
.refs.top::before{z-index:3;border-top-width:calc(var(--u)*.4)}
.story,.row{border-width:calc(var(--u)*.4) !important}
.refs.top .qb{border-left-width:calc(var(--u)*.4)}
.refs.top .qb svg{top:calc(var(--u)*.49);height:calc(100% - var(--u)*.61)}
.story::before,.row::before{content:'';display:block;height:calc(var(--u)*.85);background:var(--c,var(--ink))}
.story.brk::before{background:#fff}
.refs.top .tg{border-right:calc(var(--u)*.4) solid var(--ink)}
.tgb{flex-direction:column;align-items:flex-start;justify-content:center;gap:calc(var(--u)*.55)}
.tgb b{font:900 calc(var(--u)*1.3)/1 'Hando',sans-serif}
.tgb i{font:700 calc(var(--u)*.95)/1 'Hando',sans-serif;font-style:normal;letter-spacing:.12em;opacity:.9}
/* v5: no left or top color lines */
.story::before,.row::before{display:none}
.story>:not(.refs),.row>:not(.refs){box-shadow:none !important;padding-left:calc(var(--u)*1.6) !important}
.refs.top::before{left:0}
.story p.sum,.row .rb{padding-bottom:calc(var(--u)*1.4)}
/* v3: flush left, thinner */
.story .refs.top,.row .refs.top{padding:0}
.refs.top{height:calc(var(--u)*5.6)}
.refs.top .qb{width:calc(var(--u)*5.6)}
.refs.top .rw{gap:calc(var(--u)*.45)}
/* mockup v2: tag block on the left, sources on one line */
.refs.top{height:calc(var(--u)*7.2);padding:0;gap:0;border-bottom:0;position:relative}
.refs.top::after{content:'';position:absolute;left:calc(var(--u)*.85);right:0;bottom:0;border-bottom:var(--b) solid var(--ink)}
.refs.top .qb{width:calc(var(--u)*7.2)}
.refs.top .tg{align-self:stretch;display:flex}
.tgb{display:flex;align-items:center;background:var(--c,var(--red));color:#fff;font:900 calc(var(--u)*1.3)/1 'Hando',sans-serif;letter-spacing:.12em;text-transform:uppercase;padding:0 calc(var(--u)*1.5) 0 calc(var(--u)*1.6);white-space:nowrap}
.story.brk .tgb{background:#fff;color:var(--red)}
.refs.top .rw{flex:1;min-width:0;padding:0 calc(var(--u)*1.3);justify-content:center;gap:calc(var(--u)*.7)}
.refs.top .rl{flex-direction:row;flex-wrap:nowrap;gap:calc(var(--u)*1.4);overflow:hidden}
.refs.top .rl li{flex:0 1 auto;min-width:0}
.refs.top .rl .o{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.refs.top .xt{order:1}
.refs.top .rl{order:2}
.new{display:inline-block;background:var(--red);color:#fff;font:900 calc(var(--u)*.9)/1 'Hando',sans-serif;letter-spacing:.12em;padding:calc(var(--u)*.3) calc(var(--u)*.6);margin-left:calc(var(--u)*.8);vertical-align:middle}
.band.red{background:var(--red);border-color:var(--red);color:#fff}
.rl .m .pill{display:none}

/* Rows */
.row{border:var(--b) solid var(--ink);margin-bottom:calc(var(--u)*1.2);background:var(--paper)}
.row:last-child{margin-bottom:0}
.rh{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:calc(var(--u)*.4) calc(var(--u)*1.4);align-items:center;padding:calc(var(--u)*1.3) calc(var(--u)*1.6) calc(var(--u)*.6)}
.rh .tt{font:700 calc(var(--u)*2.6)/1.22 'Hando',sans-serif}
.rh .meta{grid-column:1}
.rh .pill{grid-row:1/3;grid-column:2}
.rb{font:400 calc(var(--u)*2.05)/1.4 'Hando',sans-serif;padding:calc(var(--u)*.4) calc(var(--u)*1.6) calc(var(--u)*1.3)}
.story>:not(.refs),.row>:not(.refs){box-shadow:inset calc(var(--u)*.85) 0 0 var(--c,var(--ink));padding-left:calc(var(--u)*2.45) !important}
.story .refs,.row .refs{padding:0 0 0 calc(var(--u)*1.6);align-items:stretch;gap:calc(var(--u)*1.2)}
.story .rw,.row .rw{align-self:center;padding:calc(var(--u)*.3) 0}

/* Meetings */
.pins{display:none!important}.pins{position:absolute;left:0;right:0;top:calc(var(--u)*10);z-index:15;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:calc(var(--u)*1.8);padding:0 calc(var(--u)*2.2);pointer-events:none}
.pin{overflow:hidden;position:relative}
.pin .band{margin:0}
.fig{position:relative;border-bottom:var(--b) solid var(--ink);background:var(--fig)}
.fig img{display:block;width:100%;height:calc(var(--u)*21);object-fit:cover}
.fig .cr{position:absolute;left:0;bottom:0;max-width:100%;background:var(--blk);color:var(--onblk);font:700 calc(var(--u)*1)/1.2 'Hando',sans-serif;letter-spacing:.1em;text-transform:uppercase;padding:calc(var(--u)*.5) calc(var(--u)*.9)}
.row .tiles{padding:calc(var(--u)*1.4) calc(var(--u)*1.6)}
.mason{column-count:2;column-gap:calc(var(--u)*1.8);padding-bottom:calc(var(--u)*1)}
.mason>*{break-inside:avoid;page-break-inside:avoid;margin-bottom:calc(var(--u)*1.5)}
.mason>.band{break-after:avoid;margin-top:calc(var(--u)*1.2);margin-bottom:calc(var(--u)*1.5)}
.mason .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
.cols>.story,.cols>.row{break-inside:avoid;page-break-inside:avoid}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:calc(var(--u)*1.1)}
.tile{border:var(--b) solid var(--ink);border-top:calc(var(--u)*.8) solid var(--ink);display:grid;grid-template-columns:calc(var(--u)*9.2) minmax(0,1fr)}
.tile .d{background:var(--blk);color:var(--onblk);text-align:center;padding:calc(var(--u)*1) 0;line-height:1}
.tile .d i{display:block;font:700 calc(var(--u)*1.25)/1 'Hando',sans-serif;letter-spacing:.2em;font-style:normal}
.tile .d b{display:block;font:900 calc(var(--u)*5)/1 'Hando',sans-serif;margin:calc(var(--u)*.35) 0}
.tile .x{padding:calc(var(--u)*1) calc(var(--u)*1.1);display:flex;flex-direction:column;gap:calc(var(--u)*.5)}
.tile .x b{font:700 calc(var(--u)*2.1)/1.2 'Hando',sans-serif}
.tile .x span{font:400 calc(var(--u)*1.5)/1.3 'Hando',sans-serif;color:var(--dim)}
.mnote{border:var(--b) solid var(--ink);padding:calc(var(--u)*1.2) calc(var(--u)*1.5);margin-top:calc(var(--u)*1.4);font:400 calc(var(--u)*1.85)/1.4 'Hando',sans-serif}
.panel > .refs{margin:calc(var(--u)*1.4) calc(var(--u)*-1.8) calc(var(--u)*-1.8);border-left:0;border-right:0;border-bottom:0}

/* Source log */
.sl{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.55fr) minmax(0,.7fr) minmax(0,1.3fr);gap:calc(var(--u)*1);align-items:center;padding:calc(var(--u)*1) 0;border-top:1px solid var(--hair)}
.sl.h{border-top:0;padding-top:0}
.sl b{font:700 calc(var(--u)*1.8)/1.15 'Hando',sans-serif;display:block}
.sl em{font:700 calc(var(--u)*1.1)/1.2 'Hando',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);font-style:normal}
.sl .n{font:400 calc(var(--u)*1.55)/1.3 'Hando',sans-serif}
.sum-line{font:400 calc(var(--u)*2)/1.4 'Hando',sans-serif;margin-bottom:calc(var(--u)*1.4)}

.endcap{text-align:center;padding:calc(var(--u)*1.5) 0 calc(var(--u)*3);font:700 calc(var(--u)*1.5)/1.4 'Hando',sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}


/* ===== v6: one layout per kind of box ===== */
/* Breaking: the whole box is red, all text white */
.story.brk{background:var(--red)}
.story.brk .refs.top{background:var(--red);color:#fff}
.story.brk .tgb{background:var(--red);color:#fff}
.story.brk .refs.top .rl .o,.story.brk .refs.top .rl .n,.story.brk .refs.top .rl .m,.story.brk .refs.top .rl .m b,.story.brk .refs.top .meta,.story.brk .refs.top .new{color:#fff}
.story.brk .refs.top .new{background:transparent;border:1px solid #fff}
/* Top stories: inverted card with a big rank number */
.story.top{background:var(--blk);color:var(--onblk);position:relative}
.story.top h3{color:var(--onblk);font-size:calc(var(--u)*4.6);padding-right:calc(var(--u)*9)}
.story.top p.sum{color:var(--onblk);opacity:.92;font-size:calc(var(--u)*2.2)}
.story.top .rank{position:absolute;right:calc(var(--u)*1.6);top:calc(var(--u)*.6);font:900 calc(var(--u)*8)/1 'Hando',sans-serif;opacity:.22;color:var(--onblk)}
html.pub .story.top .rank{opacity:1;color:var(--c)}
/* Sports: scoreboard, headline block left, summary right */
.row.l-sports{display:grid;grid-template-columns:38% 62%}
.row.l-sports .rh{background:var(--fig);border-right:calc(var(--u)*.4) solid var(--ink);align-items:center;display:flex}

/* the org map's flicker: each block steps through light, medium and dark on its own, top to bottom */
.rv-on{--paper:#0D0F12;--thin:#D4D4D4;--thick:#D4D4D4;--mast:#2B2B2B;--mast-text:#D4D4D4;--fig:#262A2F;--blk:#D4D4D4;--blkt:#2B2B2B;--onblk:#0D0F12;--ink:var(--thick);--muted:var(--thin);--hair:color-mix(in srgb,var(--thin) 40%,var(--paper));--dim:color-mix(in srgb,var(--thin) 72%,var(--paper));color-scheme:dark}
.rv-mid,html.dark .rv-mid{--paper:#707173;--thin:#707173;--thick:#707173;--mast:#6F6F6F;--mast-text:#707173;--fig:#6C6E71;--blk:#808080;--blkt:#828282;--onblk:#808283;--ink:var(--thick);--muted:var(--thin);--hair:color-mix(in srgb,var(--thin) 40%,var(--paper));--dim:color-mix(in srgb,var(--thin) 72%,var(--paper))}
html.dark .rv-off,.rv-off{--paper:#D4D4D4;--thin:#0D0F12;--thick:#0D0F12;--mast:#B3B3B3;--mast-text:#0D0F12;--fig:#B3B3B3;--blk:#2B2B2B;--blkt:#D9D9D9;--onblk:#F3F4F5;--ink:var(--thick);--muted:var(--thin);--hair:color-mix(in srgb,var(--thin) 40%,var(--paper));--dim:color-mix(in srgb,var(--thin) 72%,var(--paper));color-scheme:light}
/* The key */
.wkey{--k:var(--u);position:fixed;inset:0;z-index:200;display:flex;align-items:flex-start;justify-content:center;background:rgba(13,15,18,.62);opacity:0;transition:opacity .22s ease;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:calc(var(--k)*4) calc(var(--k)*3);user-select:text;-webkit-user-select:text}
html.one .wkey{--k:calc(var(--u)*1.8);padding:calc(var(--k)*2.4) calc(var(--k)*1.4) calc(var(--k)*6)}
.wkey.on{opacity:1}
.wkey .ks{position:relative;width:min(100%,calc(var(--k)*86));background:var(--paper);color:var(--ink);border:calc(var(--b)*1.5) solid var(--ink);transform:translateY(calc(var(--k)*3));transition:transform .3s cubic-bezier(.2,.7,.2,1);font-family:'Hando',sans-serif}
.wkey .ks::after{content:'';position:absolute;inset:0;pointer-events:none;background-image:var(--grain-data);background-size:192px 192px,240px 240px;opacity:.33}
html.dark .wkey .ks::after{opacity:.16;mix-blend-mode:screen}
.wkey.on .ks{transform:none}
.wkey .kh{display:flex;align-items:center;gap:calc(var(--k)*1.4);background:var(--ink);color:var(--paper);padding:calc(var(--k)*1.2) calc(var(--k)*1.8)}
.wkey .kh svg{width:calc(var(--k)*2.6);height:calc(var(--k)*2.8);flex:none}
.wkey .kh h2{margin:0;font:900 calc(var(--k)*2.5)/1 'Hando',sans-serif;letter-spacing:.03em;text-transform:uppercase}
.wkey .kx{margin-left:auto;border:0;background:transparent;color:inherit;font:900 calc(var(--k)*1.4)/1 'Hando',sans-serif;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;padding:calc(var(--k)*.5) 0}
@media (hover:hover){.wkey .kx:hover{color:var(--red)}}
.wkey .kg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0}
html.one .wkey .kg{grid-template-columns:minmax(0,1fr)}
.wkey{align-items:center;overflow:hidden !important}
.wkey .ks{display:flex;flex-direction:column;height:100%;max-height:calc(var(--k)*110)}
html.one .wkey{padding:calc(var(--k)*1.4) calc(var(--k)*1.2) calc(var(--k)*1.4) !important}
html.one .wkey .ks{max-height:none}
.wkey .kg{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;align-content:start}
.wkey .kh{justify-content:flex-start}.wkey .kh .q1 svg{transform:rotate(180deg)}.wkey .kh h2{flex:none}
.wkey .kh .q1,.wkey .kh .q2{display:flex}.wkey .kh .q1 .qf,.wkey .kh .q2 .qf{transform:none !important}
.wkey .kf{flex:none;display:flex;justify-content:flex-end;border-top:var(--b) solid var(--ink)}
.wkey .kf .kx{margin:0;background:var(--ink);color:var(--paper);padding:calc(var(--k)*1.5) calc(var(--k)*2.2);font:900 calc(var(--k)*1.6)/1 'Hando',sans-serif;letter-spacing:.1em;text-transform:uppercase}
html.one .wkey .kf .kx{font-size:calc(var(--k)*1.7);padding:calc(var(--k)*1.8) calc(var(--k)*2.4)}
.wkey .kc{padding:calc(var(--k)*1.6) calc(var(--k)*1.8);border-top:var(--b) solid var(--ink);min-width:0}
.wkey .kc.w{grid-column:1/-1}
html:not(.one) .wkey .kc:not(.w):nth-child(even){border-left:var(--b) solid var(--ink)}
.wkey h3{margin:0 0 calc(var(--k)*1.1);font:900 calc(var(--k)*1.15)/1 'Hando',sans-serif;letter-spacing:.16em;text-transform:uppercase;opacity:.75}
.wkey p{margin:0;font:400 calc(var(--k)*1.5)/1.4 'Hando',sans-serif}
.wkey small{display:block;font:700 calc(var(--k)*1)/1.25 'Hando',sans-serif;letter-spacing:.06em;text-transform:uppercase;opacity:.7}
/* refresh timeline */
.wkey .tl{position:relative;height:calc(var(--k)*3.8);margin:calc(var(--k)*1.2) 0 calc(var(--k)*.3)}
.wkey .tl::before{content:'';position:absolute;left:0;right:0;top:calc(var(--k)*1.1);height:var(--b);background:var(--ink)}
.wkey .tl i{position:absolute;top:calc(var(--k)*.45);width:calc(var(--k)*1.4);height:calc(var(--k)*1.4);margin-left:calc(var(--k)*-.7);background:var(--ink);border-radius:50%}
.wkey .tl i.e{background:var(--paper);border:var(--b) solid var(--ink);box-sizing:border-box}
.wkey .tl b{position:absolute;top:calc(var(--k)*2.3);transform:translateX(-50%);font:900 calc(var(--k)*1.15)/1 'Hando',sans-serif;letter-spacing:.06em;white-space:nowrap}
.wkey .tl b.e{opacity:.5;font-weight:700}
/* mini board */
.wkey .mb{columns:2;column-gap:calc(var(--k)*.8)}
html:not(.one) .wkey .mb{columns:4}
.wkey .mb > div{break-inside:avoid;margin-bottom:calc(var(--k)*.8);border:var(--b) solid #0D0F12;padding:calc(var(--k)*.7) calc(var(--k)*.8);color:#0D0F12;position:relative;box-sizing:border-box}
.wkey .mb b{display:block;font:900 calc(var(--k)*1.2)/1.1 'Hando',sans-serif;letter-spacing:.06em;text-transform:uppercase}
.wkey .mb span{display:block;margin-top:calc(var(--k)*.35);font:400 calc(var(--k)*1.15)/1.25 'Hando',sans-serif}
.wkey .mb .ln{display:block;height:calc(var(--k)*.45);background:currentColor;opacity:.18;margin-top:calc(var(--k)*.45)}
.wkey .mb .ln.s{width:62%}.wkey .mb .mt b{color:#F3F4F5}.wkey .mb .mt span{margin-top:calc(var(--k)*.75)}
/* open flow */
.wkey .fw{display:flex;align-items:stretch;gap:calc(var(--k)*.5)}
.wkey .fw > div{flex:1;min-width:0;border:var(--b) solid var(--ink);padding:calc(var(--k)*.8);display:flex;flex-direction:column;gap:calc(var(--k)*.4)}
.wkey .fw > i{flex:none;align-self:center;font:900 calc(var(--k)*1.8)/1 'Hando',sans-serif;font-style:normal}
.wkey .fw b{font:900 calc(var(--k)*1.15)/1.1 'Hando',sans-serif;letter-spacing:.06em;text-transform:uppercase}
.wkey .fw svg{width:calc(var(--k)*2.6);height:calc(var(--k)*2.6)}
/* meter chart */
.wkey .mc{display:grid;grid-template-columns:calc(var(--k)*13) minmax(0,1fr);gap:calc(var(--k)*1.4);align-items:center}
