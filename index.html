html.dark{--paper:#0D0F12;--thin:#D4D4D4;--thick:#D4D4D4;--mast:#2B2B2B;--mast-text:#D4D4D4;--fig:#262A2F;--blk:#D4D4D4;--blkt:#2B2B2B;--onblk:#0D0F12;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;overflow:hidden}
body{font:400 16px/1.5 'Hando','Helvetica Neue',Arial,sans-serif;color:var(--ink)}

.stage{position:fixed;background:var(--paper);color:var(--ink);overflow:hidden;font-family:'Hando','Helvetica Neue',Arial,sans-serif}
.grain{position:absolute;inset:0;pointer-events:none;z-index:60;opacity:.33;background-image:var(--grain-data);background-size:192px 192px,240px 240px}
html.dark .grain{opacity:.16;mix-blend-mode:screen}

/* Masthead: the Office header pattern */
.mast{position:absolute;left:0;right:0;top:0;z-index:20;height:calc(var(--u)*10);display:flex;align-items:center;gap:calc(var(--u)*2);
  background:var(--mast);color:var(--mast-text);border:var(--b) solid var(--ink);padding:0 0 0 calc(var(--u)*2.2)}
.brand{display:flex;align-items:center;gap:calc(var(--u)*2.2);min-width:0}
.brand .ws{font:900 calc(var(--u)*5)/1 'Hando',sans-serif;letter-spacing:.03em;text-transform:uppercase}
.brand .dv{flex:none;width:var(--b);height:calc(var(--u)*5.6);background:var(--ink)}
.logo{display:block;width:calc(var(--u)*21);height:calc(var(--u)*2.94);background:currentColor;-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat}
.who{margin-left:auto;text-align:right;display:flex;flex-direction:row;align-items:center;gap:calc(var(--u)*2);padding-right:calc(var(--u)*2.2);white-space:nowrap}
.who b{font:900 calc(var(--u)*6)/1 'Hando',sans-serif}
.who span{display:flex;flex-direction:column;gap:calc(var(--u)*.5);font:700 calc(var(--u)*1.7)/1.1 'Hando',sans-serif;letter-spacing:.12em;text-transform:uppercase;text-align:right}
.who span i{font-style:normal}
.who span i:first-child{font-weight:900}

.alert{position:absolute;left:0;right:0;top:calc(var(--u)*10);z-index:18;display:none;background:var(--red);color:#fff;padding:calc(var(--u)*1) calc(var(--u)*2.2);
  font:900 calc(var(--u)*2.6)/1.1 'Hando',sans-serif;letter-spacing:.06em;text-transform:uppercase;border:var(--b) solid var(--ink)}
.alert.on{display:block}

.view{position:absolute;left:0;right:0;top:calc(var(--u)*10);bottom:0;overflow:hidden}
.track{will-change:transform;padding:0 calc(var(--u)*2.2)}
.copy{padding-top:calc(var(--u)*3)}

/* Sections: a dark band with a heading, then a framed panel */
.sec{margin-bottom:calc(var(--u)*3.4)}
.band{display:flex;align-items:center;gap:calc(var(--u)*1.2);background:var(--blk);color:var(--onblk);border:var(--b) solid var(--blk);padding:calc(var(--u)*1.1) calc(var(--u)*1.8)}
.band h2{font:900 calc(var(--u)*2.7)/1.1 'Hando',sans-serif;letter-spacing:-.01em}
.band small{margin-left:auto;font:700 calc(var(--u)*1.25)/1.3 'Hando',sans-serif;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.panel{border:var(--b) solid var(--ink);border-top:0;padding:calc(var(--u)*1.8);background:var(--paper)}

.k{font:700 calc(var(--u)*1.25)/1.3 'Hando',sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.pill{display:inline-block;white-space:nowrap;border:var(--b) solid var(--c,var(--ink));color:var(--c,var(--ink));font:700 calc(var(--u)*1.25)/1 'Hando',sans-serif;letter-spacing:.12em;text-transform:uppercase;padding:calc(var(--u)*.55) calc(var(--u)*.9)}
.pill.fill{background:var(--c,var(--ink));color:#fff}
.s-Confirmed,.s-Used{--c:var(--green)}
.s-Expected{--c:var(--orange)}
.s-Reported,.s-Watching,.s-Open,.s-Checked{--c:var(--teal)}
.s-Background,.s-NotConnected,.s-Notchecked{--c:var(--grey)}
.s-Official{--c:var(--blk)}
.s-News{--c:var(--ink)}
html.dark .s-Official{--c:var(--ink)}

/* Overview */
.ov{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(0,1fr);gap:calc(var(--u)*1.8)}
.big{font:900 calc(var(--u)*10)/1 'Hando',sans-serif;margin-top:calc(var(--u)*.8)}
.big small{font:700 calc(var(--u)*2.6) 'Hando',sans-serif;letter-spacing:.06em;margin-left:calc(var(--u)*.8)}
.stat{font:400 calc(var(--u)*2.1)/1.35 'Hando',sans-serif;margin:calc(var(--u)*.6) 0 calc(var(--u)*1.8)}
.cats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:calc(var(--u)*.8);margin-top:calc(var(--u)*.8)}
.cat{border:var(--b) solid var(--ink);border-top:calc(var(--u)*.8) solid var(--c,var(--ink));padding:calc(var(--u)*.8) calc(var(--u)*.9) calc(var(--u)*.9)}
.cat.zero{opacity:.45}
.cat b{display:block;font:900 calc(var(--u)*4.4)/1 'Hando',sans-serif}
.cat span{display:block;font:700 calc(var(--u)*1.05)/1.2 'Hando',sans-serif;letter-spacing:.1em;text-transform:uppercase;margin-top:calc(var(--u)*.5)}
.legend{display:flex;flex-wrap:wrap;gap:calc(var(--u)*.7);margin-top:calc(var(--u)*1.2)}
.act{background:var(--blk);color:var(--onblk);padding:calc(var(--u)*1.8);display:flex;flex-direction:column;gap:calc(var(--u)*1)}
.act .plus{font:300 calc(var(--u)*9)/.8 'Hando',sans-serif}
.act b{font:900 calc(var(--u)*2.8)/1.1 'Hando',sans-serif}
.act p{font-size:calc(var(--u)*1.7);line-height:1.4;opacity:.92}

/* Stories */
.story{--c:var(--ink);border:var(--b) solid var(--ink);margin-bottom:calc(var(--u)*1.6);background:var(--paper)}
.story:last-child{margin-bottom:0}
.sh{display:flex;justify-content:space-between;align-items:center;gap:calc(var(--u)*1.4);padding:calc(var(--u)*1.1) calc(var(--u)*1.6);border-bottom:1px solid var(--hair)}
.meta{font:700 calc(var(--u)*1.25)/1.35 'Hando',sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.story h3{font:900 calc(var(--u)*3.7)/1.1 'Hando',sans-serif;padding:calc(var(--u)*1.4) calc(var(--u)*1.6) calc(var(--u)*.8)}
.story p.sum{font:400 calc(var(--u)*2.15)/1.42 'Hando',sans-serif;padding:0 calc(var(--u)*1.6) calc(var(--u)*1.6)}

/* Breaking: solid fill block inside the column grid */
.story.brk{background:var(--red);color:#fff;border-color:var(--ink)}
.story.brk>:not(.refs){box-shadow:none;padding-left:calc(var(--u)*1.6) !important;color:#fff}
.story.brk .sh{border-bottom:var(--b) solid rgba(255,255,255,.55)}
.story.brk .meta{color:#fff}
.story.brk h3{font-size:calc(var(--u)*4.4)}
.story.brk p.sum{font-size:calc(var(--u)*2.3)}
.story.brk .pill.fill{background:#fff;color:var(--red);border-color:#fff}
.story.brk .new{background:#fff;color:var(--red)}
.story.brk .refs{color:var(--ink)}
/* Sources: a ledger of citations, not blocks */
.refs{border-top:var(--b) solid var(--ink);background:var(--fig);padding:calc(var(--u)*.7) calc(var(--u)*1.2);display:flex;align-items:center;gap:calc(var(--u)*1.2)}
.refs .k{display:none}
.rw{flex:1;min-width:0}
.rl{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:calc(var(--u)*.35) calc(var(--u)*1.3)}
.rl li{display:inline-flex;align-items:baseline;gap:calc(var(--u)*.45);white-space:nowrap}
.rl .n{font:900 calc(var(--u)*1.2)/1.2 'Hando',sans-serif;color:var(--dim)}
.rl .o{font:900 calc(var(--u)*1.4)/1.2 'Hando',sans-serif;letter-spacing:.05em;text-transform:uppercase}
.rl .m{font:700 calc(var(--u)*1)/1.2 'Hando',sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.rl .m b{font-weight:900;color:var(--ink);margin-left:calc(var(--u)*.4)}
.qr{flex:none;display:flex;align-self:stretch}
.refs{height:calc(var(--u)*7.2);box-sizing:border-box;overflow:hidden}

.popwrap{position:fixed;z-index:41;overflow:hidden;transition:left .45s cubic-bezier(.2,.7,.2,1),width .45s cubic-bezier(.2,.7,.2,1),top .45s cubic-bezier(.2,.7,.2,1),opacity .3s ease;scrollbar-width:none}
.popwrap::-webkit-scrollbar{display:none}
.popwrap.off{opacity:0}
.popsrc{display:grid;grid-template-rows:0fr;overflow:hidden;transition:grid-template-rows .5s cubic-bezier(.2,.7,.2,1);background:var(--fig);border:var(--b) solid var(--ink);border-top:0}
.popwrap.srcs .popsrc{grid-template-rows:1fr}
.popsrc > *{min-height:0;overflow:hidden}
.popsrc .ph{display:flex;justify-content:space-between;align-items:center;padding:calc(var(--u)*1) calc(var(--u)*1.4);font:900 calc(var(--u)*1.5)/1 'Hando',sans-serif;letter-spacing:.14em;text-transform:uppercase;background:var(--ink);color:var(--paper)}
.popsrc .ph em{font-style:normal;opacity:.7}
.popsrc .ps{display:flex;gap:calc(var(--u)*1.4);padding:calc(var(--u)*1.2) calc(var(--u)*1.4);border-top:var(--b) solid var(--ink);color:var(--ink);text-decoration:none}
.popsrc .ps .n{font:900 calc(var(--u)*1.6)/1.3 'Hando',sans-serif}
.popsrc .ps .b{display:flex;flex-direction:column;gap:calc(var(--u)*.45)}
.popsrc .ps b{font:900 calc(var(--u)*1.5)/1.2 'Hando',sans-serif;letter-spacing:.1em;text-transform:uppercase}
.popsrc .ps i{font:400 calc(var(--u)*1.9)/1.3 'Hando',sans-serif;font-style:italic;text-decoration:underline;text-underline-offset:.15em}
.popsrc .ps small{font:700 calc(var(--u)*1.2)/1 'Hando',sans-serif;letter-spacing:.1em;text-transform:uppercase;opacity:.65}
.popsrc .ps0{padding:calc(var(--u)*1.4);font:400 calc(var(--u)*1.7)/1.3 'Hando',sans-serif}
html.one .popsrc .ph{font-size:calc(var(--u)*3)}
html.one .popsrc .ps .n,html.one .popsrc .ps b{font-size:calc(var(--u)*3)}
html.one .popsrc .ps i{font-size:calc(var(--u)*3.8)}
html.one .popsrc .ps small{font-size:calc(var(--u)*2.4)}
.popx{position:fixed;z-index:43;left:50%;bottom:calc(var(--u)*1.6);transform:translateX(-50%);display:flex;gap:calc(var(--u)*.8);opacity:0;transition:opacity .3s ease;pointer-events:none}
.popx.on{pointer-events:auto}
.popx button{font:900 calc(var(--u)*1.5)/1 'Hando',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--paper);background:var(--ink);border:0;padding:calc(var(--u)*1) calc(var(--u)*1.8);cursor:pointer;white-space:nowrap}

html.one .popx{bottom:calc(var(--u)*3)}
html.one .popx button{font-size:calc(var(--u)*3);padding:calc(var(--u)*2) calc(var(--u)*3.4)}
.popx.on{opacity:1}

/* sponsor blocks: copper */
:root{--spon:#A86A3E}
/* Public header: a light bulb (dark mode) and a key button take the clock's place. TV keeps the clock. */
.hbtn{display:none}
html.pub .mast #time{display:none !important}
html.pub .mast .who{gap:calc(var(--u)*.7)}
html.pub .hbtn{--hs:calc(var(--u)*3.6);position:relative;display:grid;place-items:center;width:calc(var(--hs)*.905);height:var(--hs);padding:0;margin:0;border:0;background:transparent;color:var(--ink);cursor:pointer;-webkit-tap-highlight-color:transparent}
html.one.pub .hbtn{--hs:calc(var(--u)*6.2)}
html.pub .hbtn::before{content:"";position:absolute;inset:calc(var(--hs)*-.45)}
html.pub .hbtn svg{width:100%;height:100%;overflow:visible;display:block;filter:url(#hgr)}
html.pub #hkey svg{transform:scale(.8)}
#hkey .qf{transform-box:view-box;transform-origin:50% 50%;transition:transform .55s cubic-bezier(.5,-.3,.3,1.35)}#hkey.inv .qf{transform:rotate(180deg)}
.wkey .kh .qf{transform-box:view-box;transform-origin:50% 50%}
.bulb svg{width:100%;height:100%;overflow:visible;display:block}
.bulb .gl{fill:transparent;stroke:currentColor;stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round;transition:fill .25s,filter .25s}
.bulb .bs{fill:currentColor;stroke:none}
.bulb .fl{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
html.dark .bulb .gl{fill:#FFF1B8;stroke:#FFF1B8;filter:drop-shadow(0 0 3px #FFF6D0) drop-shadow(0 0 10px rgba(255,214,120,.95)) drop-shadow(0 0 22px rgba(255,150,60,.55))}
html.dark .bulb .fl{stroke:#B26A12}
html.dark .bulb.pop .gl{animation:glon 1.1s linear 1}
html:not(.dark) .bulb.pop .gl{animation:gloff 1.1s linear 1}
.bulb::after{content:"";position:absolute;left:50%;top:42%;width:100%;aspect-ratio:1;transform-origin:50% 50%;translate:-50% -50%;border-radius:50%;pointer-events:none;opacity:0;background:radial-gradient(circle,rgba(255,244,200,.95) 0,rgba(255,214,120,.6) 22%,rgba(255,160,60,.28) 48%,rgba(255,150,60,0) 70%)}
html.dark .bulb.pop::after{animation:haloon 1.1s linear 1}
html:not(.dark) .bulb.pop::after{animation:halooff 1.1s linear 1}
.hbtn:focus-visible{outline:2px solid currentColor;outline-offset:2px}

/* the org map's flicker: each block steps through light, medium and dark on its own, top to bottom */
.rv-on{--paper:#0D0F12;--thin:#D4D4D4;--thick:#D4D4D4;--mast:#2B2B2B;--mast-text:#D4D4D4;--fig:#262A2F;--blk:#D4D4D4;--blkt:#2B2B2B;--onblk:#0D0F12;--ink:var(--thick);--muted:var(--thin);--hair:color-mix(in srgb,var(--thin) 40%,var(--paper));--dim:color-mix(in srgb,var(--thin) 72%,var(--paper));color-scheme:dark}
.rv-mid,html.dark .rv-mid{--paper:#707173;--thin:#707173;--thick:#707173;--mast:#6F6F6F;--mast-text:#707173;--fig:#6C6E71;--blk:#808080;--blkt:#828282;--onblk:#808283;--ink:var(--thick);--muted:var(--thin);--hair:color-mix(in srgb,var(--thin) 40%,var(--paper));--dim:color-mix(in srgb,var(--thin) 72%,var(--paper))}
html.dark .rv-off,.rv-off{--paper:#D4D4D4;--thin:#0D0F12;--thick:#0D0F12;--mast:#B3B3B3;--mast-text:#0D0F12;--fig:#B3B3B3;--blk:#2B2B2B;--blkt:#D9D9D9;--onblk:#F3F4F5;--ink:var(--thick);--muted:var(--thin);--hair:color-mix(in srgb,var(--thin) 40%,var(--paper));--dim:color-mix(in srgb,var(--thin) 72%,var(--paper));color-scheme:light}
/* The key */
.wkey{--k:var(--u);position:fixed;inset:0;z-index:200;display:flex;align-items:flex-start;justify-content:center;background:rgba(13,15,18,.62);opacity:0;transition:opacity .22s ease;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:calc(var(--k)*4) calc(var(--k)*3);user-select:text;-webkit-user-select:text}
html.one .wkey{--k:calc(var(--u)*1.8);padding:calc(var(--k)*2.4) calc(var(--k)*1.4) calc(var(--k)*6)}
.wkey.on{opacity:1}
.wkey .ks{position:relative;width:min(100%,calc(var(--k)*86));background:var(--paper);color:var(--ink);border:calc(var(--b)*1.5) solid var(--ink);transform:translateY(calc(var(--k)*3));transition:transform .3s cubic-bezier(.2,.7,.2,1);font-family:'Hando',sans-serif}
.wkey .ks::after{content:'';position:absolute;inset:0;pointer-events:none;background-image:var(--grain-data);background-size:192px 192px,240px 240px;opacity:.33}
html.dark .wkey .ks::after{opacity:.16;mix-blend-mode:screen}
.wkey.on .ks{transform:none}
.wkey .kh{display:flex;align-items:center;gap:calc(var(--k)*1.4);background:var(--ink);color:var(--paper);padding:calc(var(--k)*1.2) calc(var(--k)*1.8)}
.wkey .kh svg{width:calc(var(--k)*2.6);height:calc(var(--k)*2.8);flex:none}
.wkey .kh h2{margin:0;font:900 calc(var(--k)*2.5)/1 'Hando',sans-serif;letter-spacing:.03em;text-transform:uppercase}
.wkey .kx{margin-left:auto;border:0;background:transparent;color:inherit;font:900 calc(var(--k)*1.4)/1 'Hando',sans-serif;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;padding:calc(var(--k)*.5) 0}
@media (hover:hover){.wkey .kx:hover{color:var(--red)}}
.wkey .kg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0}
html.one .wkey .kg{grid-template-columns:minmax(0,1fr)}
.wkey .kc{padding:calc(var(--k)*1.6) calc(var(--k)*1.8);border-top:var(--b) solid var(--ink);min-width:0}
.wkey .kc.w{grid-column:1/-1}
html:not(.one) .wkey .kc:not(.w):nth-child(even){border-left:var(--b) solid var(--ink)}
.wkey h3{margin:0 0 calc(var(--k)*1.1);font:900 calc(var(--k)*1.15)/1 'Hando',sans-serif;letter-spacing:.16em;text-transform:uppercase;opacity:.75}
.wkey p{margin:0;font:400 calc(var(--k)*1.5)/1.4 'Hando',sans-serif}
.wkey small{display:block;font:700 calc(var(--k)*1)/1.25 'Hando',sans-serif;letter-spacing:.06em;text-transform:uppercase;opacity:.7}
/* refresh timeline */
.wkey .tl{position:relative;height:calc(var(--k)*3.8);margin:calc(var(--k)*1.2) 0 calc(var(--k)*.3)}
.wkey .tl::before{content:'';position:absolute;left:0;right:0;top:calc(var(--k)*1.1);height:var(--b);background:var(--ink)}
.wkey .tl i{position:absolute;top:calc(var(--k)*.45);width:calc(var(--k)*1.4);height:calc(var(--k)*1.4);margin-left:calc(var(--k)*-.7);background:var(--ink);border-radius:50%}
.wkey .tl i.e{background:var(--paper);border:var(--b) solid var(--ink);box-sizing:border-box}
.wkey .tl b{position:absolute;top:calc(var(--k)*2.3);transform:translateX(-50%);font:900 calc(var(--k)*1.15)/1 'Hando',sans-serif;letter-spacing:.06em;white-space:nowrap}
.wkey .tl b.e{opacity:.5;font-weight:700}
/* mini board */
.wkey .mb{columns:2;column-gap:calc(var(--k)*.8)}
html:not(.one) .wkey .mb{columns:4}
.wkey .mb > div{break-inside:avoid;margin-bottom:calc(var(--k)*.8);border:var(--b) solid #0D0F12;padding:calc(var(--k)*.7) calc(var(--k)*.8);color:#0D0F12;position:relative;box-sizing:border-box}
.wkey .mb b{display:block;font:900 calc(var(--k)*1.2)/1.1 'Hando',sans-serif;letter-spacing:.06em;text-transform:uppercase}
.wkey .mb span{display:block;margin-top:calc(var(--k)*.35);font:400 calc(var(--k)*1.15)/1.25 'Hando',sans-serif}
.wkey .mb .ln{display:block;height:calc(var(--k)*.45);background:currentColor;opacity:.18;margin-top:calc(var(--k)*.45)}
.wkey .mb .ln.s{width:62%}.wkey .mb .mt b{color:#F3F4F5}.wkey .mb .mt span{margin-top:calc(var(--k)*.75)}
/* open flow */
.wkey .fw{display:flex;align-items:stretch;gap:calc(var(--k)*.5)}
.wkey .fw > div{flex:1;min-width:0;border:var(--b) solid var(--ink);padding:calc(var(--k)*.8);display:flex;flex-direction:column;gap:calc(var(--k)*.4)}
.wkey .fw > i{flex:none;align-self:center;font:900 calc(var(--k)*1.8)/1 'Hando',sans-serif;font-style:normal}
.wkey .fw b{font:900 calc(var(--k)*1.15)/1.1 'Hando',sans-serif;letter-spacing:.06em;text-transform:uppercase}
.wkey .fw svg{width:calc(var(--k)*2.6);height:calc(var(--k)*2.6)}
/* meter chart */
.wkey .mc{display:grid;grid-template-columns:calc(var(--k)*13) minmax(0,1fr);gap:calc(var(--k)*1.4);align-items:center}
.wkey .mc svg{width:100%;height:auto;display:block}
.wkey .mc ol{list-style:none;margin:0;padding:0;display:grid;gap:calc(var(--k)*.55)}
.wkey .mc li{display:grid;grid-template-columns:calc(var(--k)*1.6) minmax(0,1fr);gap:calc(var(--k)*.6);align-items:baseline}
.wkey .mc li em{font:900 calc(var(--k)*1.3)/1 'Hando',sans-serif;font-style:normal}
.wkey .mc li b{display:block;font:900 calc(var(--k)*1.2)/1.1 'Hando',sans-serif;letter-spacing:.06em;text-transform:uppercase}
.wkey .mc li span{font:400 calc(var(--k)*1.15)/1.25 'Hando',sans-serif;opacity:.85}
/* tag color bar */
.wkey .cb{display:flex;border:var(--b) solid var(--ink);height:calc(var(--k)*3.4)}
.wkey .cb > div{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 calc(var(--k)*.6);color:#fff;min-width:0}
.wkey .cb b{font:900 calc(var(--k)*1.1)/1 'Hando',sans-serif;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wkey .ax{display:flex;justify-content:space-between;margin-top:calc(var(--k)*.5)}
/* SPARC */
.wkey .sp5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:calc(var(--k)*.5)}
.wkey .sp5 div{border:var(--b) solid var(--ink);text-align:center;padding:calc(var(--k)*.6) 0}
.wkey .sp5 b{display:block;font:900 calc(var(--k)*2.6)/1 'Hando',sans-serif}
.wkey .sp5 small{margin-top:calc(var(--k)*.4);font-size:calc(var(--k)*.95)}
/* kinds */
.wkey .kd{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:calc(var(--k)*.5)}
html.one .wkey .kd{grid-template-columns:repeat(3,minmax(0,1fr))}
.wkey .kd div{background:#fff;color:#0D0F12;border:var(--b) solid #0D0F12;padding:calc(var(--k)*.55) calc(var(--k)*.6)}
html.dark .wkey .kd div{background:#2B2B2B;color:#D4D4D4;border-color:#D4D4D4}
.wkey .kd b{display:block;font:900 calc(var(--k)*1.05)/1.1 'Hando',sans-serif;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wkey .kd span{display:block;margin-top:calc(var(--k)*.25);font:400 calc(var(--k)*1.05)/1.2 'Hando',sans-serif;opacity:.8}
html body .mason > .spon .spl,html body .popwrap .spon .spl{display:flex !important;align-items:center;justify-content:center;background:var(--spon) !important;border-color:var(--spon) !important;color:#fff !important}
.spon .spl span{font:900 calc(var(--u)*1.15)/1 'Hando',sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#fff}
html.one .spon .spl span{font-size:calc(var(--u)*1.9)}
html.one .stage{position:absolute !important;border-top:env(safe-area-inset-top) solid transparent;background-image:linear-gradient(color-mix(in srgb,var(--paper) 67%,transparent),color-mix(in srgb,var(--paper) 67%,transparent)),var(--grain-data);background-size:auto,192px 192px,240px 240px;background-clip:border-box;background-origin:border-box}
html.one,html.one body{background:var(--paper) linear-gradient(color-mix(in srgb,var(--paper) 67%,transparent),color-mix(in srgb,var(--paper) 67%,transparent)) !important}
.intronote{position:absolute;bottom:calc(var(--u)*3);z-index:2;text-align:center;font:800 calc(var(--u)*1.2)/1 'Hando',sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--ink);opacity:0;transition:opacity .6s ease;pointer-events:none}
.intronote.on{opacity:.45;animation:introPulse 1.8s ease-in-out infinite}

var qrcode = function() {

  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {

        }

        } else {
          _modules[8][15 - i - 1] = mod;
        }

              var mask = maskFunc(row, col - c);

                dark = !dark;

              _modules[row][col - c] = dark;

                bitIndex = 7;
              }

          if (row < 0 || _moduleCount <= row) {

            break;
          }

      var maxDcCount = 0;
      var maxEcCount = 0;

      for (var i = 0; i < rsBlocks.length; i += 1) {

          }

            index += 1;

          + buffer.getLengthInBits()

          + totalDataCount * 8
          + ')';

        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);

        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {

      }
      return _modules[row][col];

    _this.getModuleCount = function() {
      return _moduleCount;

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );

      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';

          qrHtml += '"/>';

      qrHtml += '</table>';

      return createDataURL(size, size, function(x, y) {

      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {

      img += '/>';

gh parking for new Spurs arena, but transit and road upgrades will be key, say city officials", "d": "Nov 18, 2026", "u": "sanantonioreport.org", "k": "News", "url": "https://sanantonioreport.org/downtown-san-antonio-enough-parking-spurs-arena/"}], "first_seen": "2026-11-23T08:00:00-06:00", "pillar": "PC", "kind": "Update", "title": "Downtown parking is enough for the Spurs arena, officials say"}], "schools": [{"summary": "The North East ISD board voted to close Montgomery, Dellview and Oak Grove elementaries to help close a $20 million deficit driven by falling enrollment. The district expects to save $4.06 million, and students will move to Windcrest, Colonial Hills and Regency Place. Attendance boundaries were adjusted for the receiving schools. Closures take effect next school year, with transition meetings planned and no layoffs at the affected campuses.", "when": "Nov 16", "refs": [{"n": "San Antonio Report", "t": "NEISD board approves closing 3 elementary schools to cut budget deficit", "d": "Nov 16, 2026", "u": "sanantonioreport.org", "k": "News", "url": "https://sanantonioreport.org/neisd-board-closing-three-elementary-schools-budget-deficit-san-antonio/"}], "first_seen": "2026-11-23T08:00:00-06:00", "pillar": "C", "kind": "Vote", "title": "NEISD closes three elementary schools in a 4 to 3 vote"}, {"summary": "Christina Martinez resigned effective Nov 16. Applicants must live in District 6 and apply by 4:30 p.m. on Dec 3, in person at the SAISD administration building or online. The appointee serves until May 1, 2027.", "when": "Nov 18", "refs": [{"n": "San Antonio Report", "t": "SAISD board opens applications for District 6 vacancy after trustee resigns", "d": "Nov 18, 2026", "u": "sanantonioreport.org", "k": "News", "url": "https://sanantonioreport.org/saisd-board-applications-district-6-vacancy-christina-martinez-resigns/"}], "first_seen": "2026-11-23T08:00:00-06:00", "pillar": "PC", "kind": "Deadline", "title": "SAISD opens District 6 seat after trustee
